# gentar arena CI (build plan phase 6).
#
# Tiers (design of record):
#   PR gate   — deterministic, subjectless suites; every PR.
#   nightly   — subject + budget-guarded suites, post-merge.
#   dispatch  — arbitrary scenario/ref, manual or from a subject repo.
#
# Every job runs on a self-hosted runner labelled `gentar-bench`: a machine
# with Docker, sbx, and ssh reach to the bench-host named by the repository
# variables GENTAR_BENCH_HOST / GENTAR_BENCH_USER (in the usual setup the
# runner IS that bench-host, and the coordinator spawns benches by SSHing to
# itself with the GENTAR_BENCH_KEY repo secret). Those two variables have no
# built-in default — unset, the coordinator refuses every run with exit 2.
# `docker compose run` exit code IS the verdict — no test-report layer in
# between.

name: gentar

on:
  pull_request:
  push:
    branches: [main]
    # Keyword tags — run the gate on ANY commit, no merge needed
    # (same grammar as the claude-playbooks arena):
    #   arena            → every gate suite, at that commit
    #   arena-<scenario> → that one suite (e.g. arena-smoke);
    #                      unknown name → coordinator refuses, exit 2
    #   v*               → release proof (every gate suite)
    # Re-run: delete and re-push the tag.
    tags: ['arena', 'arena-*', 'v*']
  schedule:
    # Off-round minute; nightly post-merge sweep.
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: "scenario to run (dispatch tier; 'nightly' runs the nightly job)"
        default: smoke
      ref:
        description: "gentar ref to test (default: default branch)"
        default: ""
      subject_ref:
        description: "subject checkout ref (when GENTAR_SUBJECT_TOKEN is set)"
        default: ""

concurrency:
  # One arena per ref — the bench-host is a single VM; two compose
  # stacks spawning sandboxes there concurrently would race names.
  group: gentar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate suite list lives HERE (single source) — the gate matrix below
  # consumes it via fromJSON. A keyword tag narrows it: `arena` / `v*`
  # keep everything, `arena-<scenario>` picks one (name validated by the
  # coordinator itself — unknown → exit 2 refusal, no bench spent).
  gate-setup:
    name: gate setup
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    # Self-hosted, like every other job here. It was ubuntu-latest, and when
    # agent-realm's GitHub-hosted minutes ran out (September 2026) every PR
    # gate failed here in 2 s, before a single suite (pilot, 2026-09-28).
    # It only reads VERSION and computes the matrix: no bench, no secrets.
    # The repository is private; the gate's bench jobs already run PR code
    # on this runner.
    runs-on: [self-hosted, gentar-bench]
    outputs:
      scenarios: ${{ steps.pick.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4

      # Release proof, first gate: a `v*` tag must name the VERSION file
      # at the commit it points at. Fails here, before the matrix —
      # a disagreeing tag spends no bench.
      - name: version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          WANT="v$(cat VERSION)"
          [ "$TAG" = "$WANT" ] || {
            echo "release tag $TAG != $WANT (VERSION file) — refusing" >&2
            exit 1
          }
          echo "release tag $TAG matches VERSION"

      - id: pick
        run: |
          ALL='["smoke","bench-template-verify","otlp-selfreport","budget-sim","scripted-onboarding","scripted-danger"]'
          OUT="$ALL"
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$TAG" != "$GITHUB_REF" ]; then
            case "$TAG" in
              arena|v*)  OUT="$ALL" ;;
              arena-*)   OUT="[\"${TAG#arena-}\"]" ;;
            esac
          fi
          echo "scenarios=$OUT" >> "$GITHUB_OUTPUT"

  gate:
    name: gate / ${{ matrix.scenario }}
    # Subjectless deterministic suites gate every PR, main push, and
    # keyword-tagged commit.
    needs: [gate-setup]
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: [self-hosted, gentar-bench]
    strategy:
      fail-fast: false
      # One bench at a time: concurrent matrix jobs on the self-hosted
      # runner fire concurrent `sbx create` on bench-host, and the
      # cross-process docker-hub refresh lock turns that contention into
      # an auth wedge (prompt timeouts) that fails every job.
      max-parallel: 1
      matrix:
        scenario: ${{ fromJSON(needs.gate-setup.outputs.scenarios) }}
    env:
      COMPOSE_PROJECT_NAME: gentar-ci
      # Telemetry destination (optional): forward every run to it.
      GENTAR_OTLP_EXPORT: ${{ secrets.GENTAR_OTLP_EXPORT }}
      GENTAR_OTLP_KEY: ${{ secrets.GENTAR_OTLP_KEY }}
      COMPOSE_FILE: ${{ format('docker-compose.yml{0}', secrets.GENTAR_OTLP_EXPORT && ':compose.export.yml' || '') }}
      # Names every sandbox this JOB creates, so teardown can remove the
      # ones a cancelled job stranded and nothing else on the shared
      # bench-host (bin/bench-reap). Unique per repository (GitHub
      # promises run ids unique only WITHIN one), per run, per attempt
      # (attempt N reaps only its own; each attempt runs its own
      # teardown), and per job: matrix jobs share a run id and attempt.
      # Compact on purpose: sbx caps a name at 64 and the run id takes 23.
      GENTAR_NAME_PREFIX: g${{ github.repository_id }}-${{ github.run_id }}-a${{ github.run_attempt }}-${{ github.job }}${{ strategy.job-index }}
      GENTAR_BENCH_HOST: ${{ vars.GENTAR_BENCH_HOST }}
      GENTAR_BENCH_USER: ${{ vars.GENTAR_BENCH_USER }}
      SCENARIO: ${{ matrix.scenario }}
      GENTAR_BENCH_KEY_FILE: /tmp/gentar_ci_bench_key
      # The runner may host another arena too (a subject repo's
      # own-arena), whose otelcol publishes the default 4318 — pin ours
      # aside (same rule as the ClickHouse 8123/8126 split).
      GENTAR_OTLP_HOST_PORT: "4319"
    steps:
      - uses: actions/checkout@v4

      - name: bench key
        run: |
          umask 077
          echo "${{ secrets.GENTAR_BENCH_KEY }}" > /tmp/gentar_ci_bench_key

      - name: run scenario (exit code = verdict)
        run: |
          docker compose build coordinator
          docker compose run --rm coordinator run "$SCENARIO"
        # `run` propagates the coordinator's exit code; a failing
        # scenario fails the job — that IS the contract.

      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per-suite name — matrix jobs upload in parallel.
          name: gentar-report-${{ matrix.scenario }}
          path: out/
          if-no-files-found: warn
          # A refusal (exit 2) writes no report; the job is already red.

      - name: teardown
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          # Sandboxes THIS job left on the bench-host (a cancelled job
          # never reaches the coordinator's own rm). Matched by the job's
          # GENTAR_NAME_PREFIX, so other arenas' live benches are safe.
          # Same key file the coordinator used — reap BEFORE removing it.
          bin/bench-reap || true
          rm -f /tmp/gentar_ci_bench_key

  nightly:
    name: nightly / subject suites
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'nightly')
    runs-on: [self-hosted, gentar-bench]
    env:
      COMPOSE_PROJECT_NAME: gentar-nightly
      # Telemetry destination (optional): forward every run to it.
      GENTAR_OTLP_EXPORT: ${{ secrets.GENTAR_OTLP_EXPORT }}
      GENTAR_OTLP_KEY: ${{ secrets.GENTAR_OTLP_KEY }}
      COMPOSE_FILE: ${{ format('docker-compose.yml{0}', secrets.GENTAR_OTLP_EXPORT && ':compose.export.yml' || '') }}
      # Names every sandbox this JOB creates, so teardown can remove the
      # ones a cancelled job stranded and nothing else on the shared
      # bench-host (bin/bench-reap). Unique per repository (GitHub
      # promises run ids unique only WITHIN one), per run, per attempt
      # (attempt N reaps only its own; each attempt runs its own
      # teardown), and per job: matrix jobs share a run id and attempt.
      # Compact on purpose: sbx caps a name at 64 and the run id takes 23.
      GENTAR_NAME_PREFIX: g${{ github.repository_id }}-${{ github.run_id }}-a${{ github.run_attempt }}-${{ github.job }}${{ strategy.job-index }}
      GENTAR_BENCH_HOST: ${{ vars.GENTAR_BENCH_HOST }}
      GENTAR_BENCH_USER: ${{ vars.GENTAR_BENCH_USER }}
      GENTAR_BUDGET_CAP: "50000"
      GENTAR_BENCH_KEY_FILE: /tmp/gentar_ci_bench_key
      GENTAR_OTLP_HOST_PORT: "4319"
      # Tier-1 credentials for the agent suite — providers are
      # alternatives: first-party API key, or any Anthropic-compatible
      # endpoint via token+base URL (GLM coding plan: ANTHROPIC_BASE_URL
      # = https://api.z.ai/api/anthropic, repo var; token as secret).
      # All empty when unset — agent-smoke then skips with a notice (or
      # refuses honestly if dispatched directly).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
      # Optional model pin for the agent suite (e.g. glm-5.3-flash on the
      # z.ai plan — slot var, see agent-smoke.toml). Unset = default.
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - name: bench key + subjects
        # Through env, not `${{ }}` pasted into the script body: a
        # value containing a quote would otherwise reach the shell
        # parser (it happens to produce a syntax error rather than
        # injection, but a repo variable should not get that far).
        env:
          GENTAR_NIGHTLY_SUBJECTS: ${{ vars.GENTAR_NIGHTLY_SUBJECTS }}
        run: |
          umask 077
          echo "${{ secrets.GENTAR_BENCH_KEY }}" > /tmp/gentar_ci_bench_key
          # Subject suites need the subject repos checked out under
          # subjects/. GENTAR_SUBJECT_TOKEN (PAT with read access) is
          # opt-in; without it the nightly run covers subjectless suites
          # only and says so. subject_ref pins what gets tested.
          if [ -n "${{ secrets.GENTAR_SUBJECT_TOKEN }}" ]; then
            REF="${{ github.event.inputs.subject_ref }}"
            REF="${REF:-main}"
            # WHICH subjects this arena tests is an install's choice, not
            # the engine's: a fork inheriting hardcoded repo paths would
            # clone someone else's subjects (or fail trying). The list
            # lives in the repo variable GENTAR_NIGHTLY_SUBJECTS as
            # space-separated `owner/repo[:full]` entries; `:full` means
            # clone with history and tags (kommander-update and
            # agent-profile-smoke both clone an old release from the
            # checkout's own tags). Unset = subjectless, the right
            # default for a fork that has named no subjects.
            SUBJECTS="$GENTAR_NIGHTLY_SUBJECTS"
            [ -n "$SUBJECTS" ] || echo "GENTAR_NIGHTLY_SUBJECTS unset — subject suites skipped"
            for entry in $SUBJECTS; do
              repo="${entry%%:*}"; depth="--depth 1"; branch=""
              case "$entry" in
                *:full) depth=""; branch="-b $REF" ;;
              esac
              name="${repo##*/}"
              git clone $depth $branch \
                "https://x-access-token:${{ secrets.GENTAR_SUBJECT_TOKEN }}@github.com/$repo" \
                "subjects/$name" 2>/dev/null || \
                echo "$repo clone failed — its suites will fail honestly"
            done
          else
            echo "GENTAR_SUBJECT_TOKEN absent — subject suites skipped"
          fi

      - name: subject suites (budget-guarded)
        run: |
          docker compose build coordinator
          # Agent-tier suite always: pty driver, scripted agent (no LLM).
          docker compose run --rm coordinator run scripted-onboarding
          # Real-agent suite when ANY provider credential exists
          # (refuses with exit 2 otherwise — guard, not silent).
          # `compose run -e NAME` with NAME unset on the host simply
          # does not forward it, so one line covers all providers.
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$ANTHROPIC_AUTH_TOKEN" ]; then
            docker compose run --rm \
              -e ANTHROPIC_API_KEY -e ANTHROPIC_AUTH_TOKEN -e ANTHROPIC_BASE_URL \
              -e ANTHROPIC_DEFAULT_SONNET_MODEL \
              coordinator run agent-smoke
            # Real agent under a PINNED playbook install (anti-ouroboros):
            # needs the credential above AND the kommander-playbook
            # subject (full clone — the pin clones the release from it).
            if [ -d subjects/kommander-playbook ]; then
              docker compose run --rm \
                -e ANTHROPIC_API_KEY -e ANTHROPIC_AUTH_TOKEN -e ANTHROPIC_BASE_URL \
                -e ANTHROPIC_DEFAULT_SONNET_MODEL \
                coordinator run agent-profile-smoke
            else
              echo "no kommander-playbook subject — agent-profile-smoke skipped"
            fi
          else
            echo "no agent credential (API_KEY/AUTH_TOKEN) — agent-smoke skipped"
          fi
          if [ -d subjects/kommander-playbook ]; then
            for s in claude-playbooks-install \
                     kommander-install kommander-task-lock kommander-update \
                     docs-honesty-kommander; do
              docker compose run --rm coordinator run "$s"
            done
          fi
          if [ -d subjects/memhouse ]; then
            for s in memhouse-install memhouse-house; do
              docker compose run --rm coordinator run "$s"
            done
          fi
          # gentar's own docs-honesty: self-subject, cloned from the very
          # checkout under test — no token needed (public repo, local clone).
          git clone -q --depth 1 "$GITHUB_WORKSPACE" subjects/gentar 2>/dev/null || true
          if [ -d subjects/gentar ]; then
            docker compose run --rm coordinator run docs-honesty-gentar
          elif [ ! -d subjects/kommander-playbook ]; then
            docker compose run --rm coordinator run smoke
          fi

      - name: teardown
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          # Sandboxes THIS job left on the bench-host (a cancelled job
          # never reaches the coordinator's own rm). Matched by the job's
          # GENTAR_NAME_PREFIX, so other arenas' live benches are safe.
          # Same key file the coordinator used — reap BEFORE removing it.
          bin/bench-reap || true
          rm -f /tmp/gentar_ci_bench_key

  dispatch:
    name: dispatch / ${{ github.event.inputs.scenario }}
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario != 'nightly'
    runs-on: [self-hosted, gentar-bench]
    env:
      COMPOSE_PROJECT_NAME: gentar-dispatch
      # Telemetry destination (optional): forward every run to it.
      GENTAR_OTLP_EXPORT: ${{ secrets.GENTAR_OTLP_EXPORT }}
      GENTAR_OTLP_KEY: ${{ secrets.GENTAR_OTLP_KEY }}
      COMPOSE_FILE: ${{ format('docker-compose.yml{0}', secrets.GENTAR_OTLP_EXPORT && ':compose.export.yml' || '') }}
      # Names every sandbox this JOB creates, so teardown can remove the
      # ones a cancelled job stranded and nothing else on the shared
      # bench-host (bin/bench-reap). Unique per repository (GitHub
      # promises run ids unique only WITHIN one), per run, per attempt
      # (attempt N reaps only its own; each attempt runs its own
      # teardown), and per job: matrix jobs share a run id and attempt.
      # Compact on purpose: sbx caps a name at 64 and the run id takes 23.
      GENTAR_NAME_PREFIX: g${{ github.repository_id }}-${{ github.run_id }}-a${{ github.run_attempt }}-${{ github.job }}${{ strategy.job-index }}
      GENTAR_BENCH_HOST: ${{ vars.GENTAR_BENCH_HOST }}
      GENTAR_BENCH_USER: ${{ vars.GENTAR_BENCH_USER }}
      GENTAR_BENCH_KEY_FILE: /tmp/gentar_ci_bench_key
      GENTAR_OTLP_HOST_PORT: "4319"
      # Pass-through for credential-declaring scenarios (agent-smoke);
      # provider alternatives, same rule as nightly. Absent → honest
      # refuse 2.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
      # Optional model pin, same rule as nightly.
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
      # Judge key for judged (semantic) scenarios such as semantic-demo —
      # the coordinator's only. Unset: they refuse with exit 2, by name.
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: bench key + subjects (opt-in)
        # Through env, not `${{ }}` pasted into the script body: a
        # value containing a quote would otherwise reach the shell
        # parser (it happens to produce a syntax error rather than
        # injection, but a repo variable should not get that far).
        env:
          GENTAR_NIGHTLY_SUBJECTS: ${{ vars.GENTAR_NIGHTLY_SUBJECTS }}
        run: |
          umask 077
          echo "${{ secrets.GENTAR_BENCH_KEY }}" > /tmp/gentar_ci_bench_key
          # Subject scenarios need the subject mounted; clone only when
          # the read token exists (otherwise such scenarios fail honestly).
          if [ -n "${{ secrets.GENTAR_SUBJECT_TOKEN }}" ]; then
            REF="${{ github.event.inputs.subject_ref }}"
            REF="${REF:-main}"
            # WHICH subjects this arena tests is an install's choice, not
            # the engine's: a fork inheriting hardcoded repo paths would
            # clone someone else's subjects (or fail trying). The list
            # lives in the repo variable GENTAR_NIGHTLY_SUBJECTS as
            # space-separated `owner/repo[:full]` entries; `:full` means
            # clone with history and tags (kommander-update and
            # agent-profile-smoke both clone an old release from the
            # checkout's own tags). Unset = subjectless, the right
            # default for a fork that has named no subjects.
            SUBJECTS="$GENTAR_NIGHTLY_SUBJECTS"
            [ -n "$SUBJECTS" ] || echo "GENTAR_NIGHTLY_SUBJECTS unset — subject suites skipped"
            for entry in $SUBJECTS; do
              repo="${entry%%:*}"; depth="--depth 1"; branch=""
              case "$entry" in
                *:full) depth=""; branch="-b $REF" ;;
              esac
              name="${repo##*/}"
              git clone $depth $branch \
                "https://x-access-token:${{ secrets.GENTAR_SUBJECT_TOKEN }}@github.com/$repo" \
                "subjects/$name" 2>/dev/null || \
                echo "$repo clone failed — its suites will fail honestly"
            done
            git clone -q --depth 1 "$GITHUB_WORKSPACE" subjects/gentar 2>/dev/null || true
          fi

      - name: run
        run: |
          docker compose build coordinator
          docker compose run --rm \
            -e ANTHROPIC_API_KEY -e ANTHROPIC_AUTH_TOKEN -e ANTHROPIC_BASE_URL \
            -e ANTHROPIC_DEFAULT_SONNET_MODEL \
            coordinator run "${{ github.event.inputs.scenario }}"

      - name: teardown
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          # Sandboxes THIS job left on the bench-host (a cancelled job
          # never reaches the coordinator's own rm). Matched by the job's
          # GENTAR_NAME_PREFIX, so other arenas' live benches are safe.
          # Same key file the coordinator used — reap BEFORE removing it.
          bin/bench-reap || true
          rm -f /tmp/gentar_ci_bench_key
