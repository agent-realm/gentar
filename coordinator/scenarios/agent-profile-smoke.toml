# Agent-under-playbook smoke — the anti-ouroboros suite. A REAL
# claude-code runs INSIDE an isolated kommander-playbook install whose
# machinery is pinned to the newest RELEASE tag (last-known-good),
# never the working-tree ref under test. The verdict is triple reality:
# version.txt string-equals the pinned VERSION (task done, answer
# sourced from the hook-injected banner), a session transcript exists
# under the pinned dir's projects/ (claude-code HONORED the config dir
# — no LLM cooperation involved), and the pinned tree sits at an exact
# release tag.
#
# Credentials: same provider-agnostic tier-1 shape as agent-smoke.
[scenario]
name = "agent-profile-smoke"
subject = "kommander-playbook"
template = "gentar-bench-v1"
credentials = ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_BASE_URL"]
# Cheap-model pin rides the same slot var as agent-smoke (no guard).
pass_env = ["ANTHROPIC_DEFAULT_SONNET_MODEL"]

[oracle]
steps = [
  # Pin last-known-good: private repo, so the release is cloned from the
  # subject's own mounted .git (full history + tags), checked out at the
  # newest tag. The ref under test is never its own tool.
  'git clone -q "$WORKSPACE_DIR" "$HOME/cpb-lkg" && LKG=$(git -C "$HOME/cpb-lkg" describe --tags --abbrev=0) && git -C "$HOME/cpb-lkg" checkout -q "$LKG" && echo "pinned:$LKG"',
  # Isolated in-place install (README standalone path) under its own name.
  'cd "$HOME/cpb-lkg" && ./install.sh --name aps',
]

[driver]
# Headless -p under the launcher shape: CLAUDE_CONFIG_DIR points the
# agent at the pinned playbook install. The version string is NOT named
# in the prompt — it arrives via the pinned playbook's own machinery:
# the SessionStart hook injects the banner (playbook name + VERSION)
# into the agent's startup context. A dead/ignored profile leaves the
# agent without the answer.
command = 'cd "$WORKSPACE_DIR" && CLAUDE_CONFIG_DIR="$HOME/cpb-lkg" DISABLE_AUTOUPDATER=1 CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 timeout 300 claude -p "Your session startup banner states the playbook you are running under and its version. Create a file named version.txt in the current working directory whose entire content is exactly that banner version string. Nothing else." --dangerously-skip-permissions'

[budget]
tokens = 20000

[[verify.commands]]
# Task done AND under the pin, exactly: string-equal to the pinned
# machinery's VERSION (no substring slack, trailing newline normalized
# away by $(cat) on both sides).
command = 'test "$(cat "$WORKSPACE_DIR/version.txt")" = "$(cat "$HOME/cpb-lkg/VERSION")" && echo exact-under-pinned-playbook'
contains = "exact-under-pinned-playbook"

[[verify.commands]]
# Machinery-live proof that needs no LLM cooperation: claude-code writes
# session transcripts under $CLAUDE_CONFIG_DIR/projects/ — a directory
# install.sh never creates (it even excludes projects/ when copying).
# A transcript there means the pinned dir was HONORED as the active
# config dir, hooks and all.
command = 'find "$HOME/cpb-lkg/projects" -name "*.jsonl" -print -quit | grep -q . && echo transcripts-in-pinned-dir'
contains = "transcripts-in-pinned-dir"

[[verify.commands]]
# The machinery is at an exact release tag, not the ref under test.
command = 'git -C "$HOME/cpb-lkg" describe --tags --exact-match HEAD >/dev/null && echo at-release-tag'
contains = "at-release-tag"
