# OTLP receiver for agent self-report from inside benches (phase 5).
# Harness spans go direct coordinator→ClickHouse; agent spans arrive
# here (relayed by the coordinator from the bench's
# $WORKSPACE_DIR/gentar-otlp.json drop file) and land in otel_traces,
# where one SQL joins them with harness spans on gentar.run_id.
#
# Credentials come from env (compose sets them from the same variables
# as the ClickHouse service) — never hardcoded.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: ${env:GENTAR_CH_DB}
    username: ${env:GENTAR_CH_USER}
    password: ${env:GENTAR_CH_PASSWORD}
    ttl: 336h

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [clickhouse]
