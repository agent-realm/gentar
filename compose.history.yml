# Layered when GENTAR_HISTORY_NETWORK is set (kit run.sh, bin/arena): the
# coordinator joins the docker network the history store lives on
# (history/compose.yml), and reaches it as http://gentar-history:8123.
services:
  coordinator:
    networks: [default, history]
networks:
  history:
    external: true
    name: ${GENTAR_HISTORY_NETWORK}
