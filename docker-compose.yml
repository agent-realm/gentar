# gentar arena — compose of record (build plan phase 1).
# Benches are NOT compose services: the coordinator spawns them as sbx
# sandboxes on a bench-host (design.md, decision #6).
#
# CI contract (phase 6): `docker compose run --rm coordinator gentar run <scenario>`
# — exit code is the verdict.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: gentar
      # Arena-internal dev credentials (compose network + localhost only).
      CLICKHOUSE_USER: ${GENTAR_CH_USER:-gentar}
      CLICKHOUSE_PASSWORD: ${GENTAR_CH_PASSWORD:-gentar}
    volumes:
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    ports:
      # Dashboard/debug access from the host only; the suites themselves
      # reach ClickHouse over the compose network (GENTAR_CLICKHOUSE_URL).
      # Two arenas on one Docker host (e.g. gentar's own CI gate and a
      # subject repo's own-arena) collide on 8123 — override with
      # GENTAR_CLICKHOUSE_HOST_PORT instead of editing this file.
      - "127.0.0.1:${GENTAR_CLICKHOUSE_HOST_PORT:-8123}:8123"

  otelcol:
    # OTLP receiver for agent self-report (phase 5): benches POST their
    # spans here; the collector exports them into ClickHouse where one
    # SQL joins them with harness spans on gentar.run_id. Published on
    # all interfaces — benches live on the bench-host, not this network.
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      GENTAR_CH_USER: ${GENTAR_CH_USER:-gentar}
      GENTAR_CH_PASSWORD: ${GENTAR_CH_PASSWORD:-gentar}
      GENTAR_CH_DB: ${GENTAR_CH_DB:-gentar}
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # Same busy-host concern as ClickHouse above: the suites reach
      # otelcol over the compose network (drop-file relay), the host
      # publish is for external POSTs — override rather than edit.
      - "${GENTAR_OTELCOL_HOST_PORT:-4318}:4318"

  coordinator:
    build: ./coordinator
    depends_on:
      clickhouse:
        condition: service_healthy
      otelcol:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      GENTAR_CLICKHOUSE_URL: http://clickhouse:8123
      GENTAR_CLICKHOUSE_USER: ${GENTAR_CH_USER:-gentar}
      GENTAR_CLICKHOUSE_PASSWORD: ${GENTAR_CH_PASSWORD:-gentar}
      GENTAR_BENCH_KEY: /run/secrets/bench_ssh_key
      GENTAR_SUBJECTS_ROOT: /subjects
    volumes:
      # Subject checkouts, mounted read-only — never baked into images.
      - ${GENTAR_SUBJECTS_DIR:-./subjects}:/subjects:ro
      # Run reports land here (report-<run_id>.md per run) — the
      # agent-feedable artifact.
      - ./out:/out
    command: [run, smoke]
    secrets:
      - source: bench_ssh_key
        target: bench_ssh_key
        mode: 0444

  dashboard:
    # Stateless generator (phase 5): renders spans into ONE self-contained
    # HTML file. Not a server — `docker compose run --rm dashboard` writes
    # dashboard/out/dashboard.html on the host.
    image: python:3.12-slim
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GENTAR_CLICKHOUSE_URL: http://clickhouse:8123
      GENTAR_CLICKHOUSE_USER: ${GENTAR_CH_USER:-gentar}
      GENTAR_CLICKHOUSE_PASSWORD: ${GENTAR_CH_PASSWORD:-gentar}
      GENTAR_CLICKHOUSE_DB: ${GENTAR_CH_DB:-gentar}
    volumes:
      - ./dashboard:/dashboard:ro
      - ./dashboard/out:/out
    command: [python, /dashboard/generate.py, --out, /out/dashboard.html]

secrets:
  bench_ssh_key:
    file: ${GENTAR_BENCH_KEY_FILE:-~/.ssh/id_ed25519}

volumes:
  clickhouse:
