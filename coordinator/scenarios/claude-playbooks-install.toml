# Subject #0 (pilot's order): the claude-playbooks installer CLI.
# Oracle = the documented install path, verbatim, no LLM.
# Phase-2 acceptance test (build plan).

[scenario]
name = "claude-playbooks-install"
subject = "kommander-playbook"
agent = "shell"

[oracle]
steps = [
  # Documented install path (README): public release asset, SHA-verified.
  # VERSION is pinned — unpinned installs hit api.github.com/releases/latest,
  # which is unauthenticated-rate-limited (60/h) across the bench-host's
  # shared sandbox egress IP; pinning also makes the oracle reproducible.
  "curl -fsSL https://raw.githubusercontent.com/ramazanpolat/claude-playbooks/main/install.sh | VERSION=v3.2.0 sh",
  # Playbook install from the mounted subject dir (private repo → local dir).
  "claude-playbook install \"$WORKSPACE_DIR\" --name kommander",
]

[[verify.files]]
path = "~/.claude-playbooks/kommander/CLAUDE.md"

[[verify.files]]
path = "~/.claude-playbooks/kommander/settings.json"

[[verify.files]]
path = "~/.claude-playbooks/kommander/hooks"

[[verify.files]]
path = "~/.local/bin/claude-playbook"

[[verify.files]]
path = "~/.local/bin/cpb"

[[verify.commands]]
command = "claude-playbook --version"
contains = "v3."

[[verify.commands]]
# Version must match the subject checkout's VERSION file — floats, never hardcoded.
command = "V=$(sed 's/^v//' \"$WORKSPACE_DIR/VERSION\"); claude-playbook info kommander | grep -E \"Version:[[:space:]]*$V\""

[[verify.commands]]
command = "claude-playbook list | grep -c kommander"

[[verify.commands]]
# Launcher alias exists (cpb-style single-letter launcher).
command = "test -x \"$HOME/.local/bin/k\" && echo launcher-k-ok"
contains = "launcher-k-ok"
