# opensandbox-server config for the gentar arena's osb profile
# (docker-compose.yml service `osb-server`). Sandboxes spawn as sibling
# containers on the arena's Docker host via the mounted docker.sock.
#
# The client of every sandbox is the coordinator container, so endpoints
# must name a host-reachable alias: host.docker.internal (the official
# server example does the same). On a pure-Linux arena host the sandbox
# port bindings are reachable directly and host_ip can be dropped.

[server]
host = "0.0.0.0"
port = 8080
max_sandbox_timeout_seconds = 86400
# Dev arena on a compose network: no api key, explicit insecure ack.
# A shared/CI arena sets api_key and passes it via GENTAR_OSB_API_KEY.

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.0.22"

[storage]
allowed_host_paths = []
volume_default_size = "1Gi"

[store]
type = "sqlite"
path = "/data/opensandbox.db"

[docker]
network_mode = "bridge"
host_ip = "host.docker.internal"
port_range_min = 40000
port_range_max = 60000
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
pids_limit = 4096

[ingress]
mode = "direct"

[egress]
image = "opensandbox/egress:v1.1.7"
mode = "dns"
readiness_timeout_seconds = 30.0

[renew_intent]
enabled = false
min_interval_seconds = 60
