# gentar CI on the PUBLIC repository: GitHub-hosted jobs only.
#
# gentar is public, so no self-hosted runner serves it: a fork's pull request
# can bring its own workflow to any runner registered here (D5, 2026-10-08;
# the move to a new bench host, 2026-10-12). Nothing in this file names a
# self-hosted label, a bench secret or a bench variable.
#
#   unit tests   every PR and every push to main: the whole unit suite on the
#                checkout, on ubuntu-latest, read-only, no secrets.
#   release tag  a `v*` tag: the tag must equal `v$(cat VERSION)`.
#   scan         every PR: the lines it adds and its commit messages, for
#                generic shapes of environment data and credentials
#                (bin/pr-scan). Prints path:line:class, never the text.
#
# The bench suites (the gate, the nightly, one-off scenarios) run in the
# PRIVATE mirror agent-realm/gentar-arena, which pulls this repository and
# admits only commits reachable from `main` or a `v*` tag: they are a
# POST-MERGE check, dispatched or on the mirror's schedule, never a PR gate.
# docs/reference/ci-and-releases.md has the whole contract.

name: gentar

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: gentar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-checkout:
    name: unit tests (checkout)
    # The engine's unit tests also run inside the coordinator image build,
    # whose context (./coordinator) has no subject-template/: every test that
    # reads the kit was skipped there (Codex on #68). This job runs the whole
    # suite on the checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit tests on the checkout
        working-directory: coordinator
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m unittest discover -s tests

  release-tag:
    name: release tag matches VERSION
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: the tag is v$(cat VERSION)
        env:
          REF: ${{ github.ref }}
        run: |
          TAG="${REF#refs/tags/}"
          WANT="v$(cat VERSION)"
          [ "$TAG" = "$WANT" ] || { echo "::error::release tag $TAG != $WANT (VERSION file)"; exit 1; }
          echo "release tag $TAG matches VERSION"

  scan:
    name: scan (added lines)
    # gentar is public: a pull request may not add an internal address, a
    # home path with a real name, a credential shape or a private model
    # route (bin/pr-scan has the shapes; synthetic fixtures are allowlisted
    # in .github/scan-allowlist.toml). Only what the PR adds, not the tree
    # already on the base branch. A required check on main and release/*.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scan the pull request's added lines and commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 bin/pr-scan --base "$BASE" --head "$HEAD"
