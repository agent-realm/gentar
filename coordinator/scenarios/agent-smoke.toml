# First agent-in-the-loop suite: a REAL claude-code (from the pinned
# bench template) does a trivial task headlessly; the verdict comes
# from reality (the file), never from the agent's word.
#
# Credentials are tier-1 (env vars on a throwaway bench) and
# provider-agnostic: the scenario declares the auth env var NAMES,
# the coordinator refuses (exit 2) before any bench exists when NONE
# is present, and exports whichever are set into the bench. Two
# provider shapes cover everything Anthropic-protocol:
#   ANTHROPIC_API_KEY                                  — first-party
#   ANTHROPIC_AUTH_TOKEN + ANTHROPIC_BASE_URL          — any
#     Anthropic-compatible endpoint (GLM coding plan at
#     https://api.z.ai/api/anthropic, routers, proxies); claude-code
#     reads both natively, no CLI config needed.
# The plumbing is provable without a valid key — an invalid key fails
# auth INSIDE the bench and fails this suite honestly with the
# transcript as evidence.
[scenario]
name = "agent-smoke"
template = "gentar-bench-v1"
credentials = ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_BASE_URL"]
# Optional cheaper-model pin: forwarded when set, no guard (unset =
# endpoint default). Slot var, NOT ANTHROPIC_MODEL — claude-code's model
# catalog hard-rejects unknown IDs like glm-5.3-flash on the main-model
# path (proven live, 2.1.234), while the slot vars accept any ID the
# endpoint serves. z.ai coding plan: ANTHROPIC_DEFAULT_SONNET_MODEL =
# glm-5.3-flash runs the whole task on flash (proven live).
pass_env = ["ANTHROPIC_DEFAULT_SONNET_MODEL"]

[driver]
# Headless -p mode: no human simulation, no turns. The driver runs the
# agent and waits for process exit (EOF), and the file is the verdict.
# Bound the CLI itself: an invalid/expired key makes claude-code
# 2.1.234 print "Execution error" and hang retrying — `timeout` turns
# that into an honest bounded failure with the transcript as evidence.
# Startup update/telemetry checks are disabled (bench egress hangs on
# them; proven live).
command = 'cd "$WORKSPACE_DIR" && DISABLE_AUTOUPDATER=1 CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 timeout 240 claude -p "Create a file named hello.txt in the current working directory with exactly this content: gentar-agent-smoke" --dangerously-skip-permissions'

[budget]
# Declared ceiling for the guard, not measured usage. Nightly's cap
# (GENTAR_BUDGET_CAP) must be >= this for the suite to run there.
tokens = 20000

[[verify.commands]]
command = 'test -f "$WORKSPACE_DIR/hello.txt" && grep -F gentar-agent-smoke "$WORKSPACE_DIR/hello.txt"'
