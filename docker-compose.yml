# gentar arena — compose of record (build plan phase 1).
# Benches are NOT compose services: the coordinator spawns them as sbx
# sandboxes on a bench-host (design.md, decision #6).
#
# CI contract (phase 6): `docker compose run --rm coordinator gentar run <scenario>`
# — exit code is the verdict.
#
# That command removes ONLY the coordinator. clickhouse and otelcol start via
# depends_on and survive it, and clickhouse owns a named volume — so every
# distinct compose project strands two containers plus a volume unless the
# caller tears the stack down. CI does that in an `if: always()` step; locally,
# use `bin/arena run <scenario>`, which tears down from a trap on every exit
# path. Every service carries `dev.gentar.arena=1` so a stranded stack can be
# identified and collected later (`bin/arena gc`).

services:
  clickhouse:
    labels:
      # Marks this container as part of a gentar arena, so `bin/arena gc`
      # can find stacks stranded by a run that skipped teardown.
      dev.gentar.arena: "1"
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: gentar
      # Arena-internal dev credentials (compose network + localhost only).
      CLICKHOUSE_USER: ${GENTAR_CH_USER:-gentar}
      CLICKHOUSE_PASSWORD: ${GENTAR_CH_PASSWORD:-gentar}
    volumes:
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    ports:
      # Dashboard/debug access from the host only; the suites themselves
      # reach ClickHouse over the compose network (GENTAR_CLICKHOUSE_URL).
      # Two arenas on one Docker host (e.g. gentar's own CI gate and a
      # subject repo's own-arena) collide on 8123 — override with
      # GENTAR_CLICKHOUSE_HOST_PORT instead of editing this file.
      - "127.0.0.1:${GENTAR_CLICKHOUSE_HOST_PORT:-8123}:8123"

  otelcol:
    labels:
      # Marks this container as part of a gentar arena, so `bin/arena gc`
      # can find stacks stranded by a run that skipped teardown.
      dev.gentar.arena: "1"
    # OTLP receiver for agent self-report (phase 5): benches POST their
    # spans here; the collector exports them into ClickHouse where one
    # SQL joins them with harness spans on gentar.run_id. Published on
    # all interfaces — benches live on the bench-host, not this network.
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      GENTAR_CH_USER: ${GENTAR_CH_USER:-gentar}
      GENTAR_CH_PASSWORD: ${GENTAR_CH_PASSWORD:-gentar}
      GENTAR_CH_DB: ${GENTAR_CH_DB:-gentar}
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # Published on all interfaces — benches live on the bench-host, not
      # this network. Two arenas on one Docker host (gentar's own gate and
      # a subject repo's own-arena) collide on 4318 — override with
      # GENTAR_OTLP_HOST_PORT instead of editing this file (same rule as
      # the ClickHouse 8123 knob).
      - "${GENTAR_OTLP_HOST_PORT:-4318}:4318"

  coordinator:
    labels:
      # Marks this container as part of a gentar arena, so `bin/arena gc`
      # can find stacks stranded by a run that skipped teardown.
      dev.gentar.arena: "1"
    build: ./coordinator
    depends_on:
      clickhouse:
        condition: service_healthy
      otelcol:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      GENTAR_CLICKHOUSE_URL: http://clickhouse:8123
      GENTAR_CLICKHOUSE_USER: ${GENTAR_CH_USER:-gentar}
      GENTAR_CLICKHOUSE_PASSWORD: ${GENTAR_CH_PASSWORD:-gentar}
      GENTAR_BENCH_KEY: /run/secrets/bench_ssh_key
      GENTAR_SUBJECTS_ROOT: /subjects
    volumes:
      # Subject checkouts, mounted read-only — never baked into images.
      - ${GENTAR_SUBJECTS_DIR:-./subjects}:/subjects:ro
      # Run reports land here (report-<run_id>.md per run) — the
      # agent-feedable artifact.
      - ./out:/out
    command: [run, smoke]
    secrets:
      - source: bench_ssh_key
        target: bench_ssh_key
        mode: 0444

  dashboard:
    labels:
      # Marks this container as part of a gentar arena, so `bin/arena gc`
      # can find stacks stranded by a run that skipped teardown.
      dev.gentar.arena: "1"
    # Stateless generator (phase 5): renders spans into ONE self-contained
    # HTML file. Not a server — `docker compose run --rm dashboard` writes
    # dashboard/out/dashboard.html on the host.
    image: python:3.12-slim
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GENTAR_CLICKHOUSE_URL: http://clickhouse:8123
      GENTAR_CLICKHOUSE_USER: ${GENTAR_CH_USER:-gentar}
      GENTAR_CLICKHOUSE_PASSWORD: ${GENTAR_CH_PASSWORD:-gentar}
      GENTAR_CLICKHOUSE_DB: ${GENTAR_CH_DB:-gentar}
    volumes:
      - ./dashboard:/dashboard:ro
      - ./dashboard/out:/out
    command: [python, /dashboard/generate.py, --out, /out/dashboard.html]

  # --profile osb: the opensandbox-server driving docker-runtime benches
  # (the `bench = "osb"` tier). Sandboxes are sibling containers on this
  # Docker host, spawned through the mounted docker.sock — NOT compose
  # services, same as every other tier. activate: `docker compose --profile
  # osb run --rm coordinator gentar run smoke-osb` with
  # GENTAR_OSB_SERVER=http://osb-server:8080.
  osb-server:
    labels:
      # Marks this container as part of a gentar arena, so `bin/arena gc`
      # can find stacks stranded by a run that skipped teardown.
      dev.gentar.arena: "1"
    image: opensandbox/server:latest
    profiles: ["osb"]
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      OPENSANDBOX_INSECURE_SERVER: "YES"   # dev arena; set api_key for real
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - osb-data:/data
    ports:
      - "127.0.0.1:${GENTAR_OSB_HOST_PORT:-8180}:8080"
    configs:
      - source: osb-server-config
        target: /etc/opensandbox/config.toml

configs:
  osb-server-config:
    file: ./osb/server.toml

secrets:
  bench_ssh_key:
    file: ${GENTAR_BENCH_KEY_FILE:-~/.ssh/id_ed25519}

volumes:
  clickhouse:
    labels:
      dev.gentar.arena: "1"
  osb-data:
    labels:
      dev.gentar.arena: "1"
