# Docs-honesty, subject gentar itself: the README's quickstart and
# status claims checked against the repo it ships in. Pure file/grep
# reality — every claim the quickstart makes a reader act on must hold:
# the files it names exist, the scenarios it names exist, the commands
# it prints have their targets. Drift guards pair each executed check
# with the README line that promises it.

[scenario]
name = "docs-honesty-gentar"
subject = "gentar"
agent = "shell"

[oracle]
steps = [
  # --- quickstart drift guards: README still prints these ---
  'grep -qF "cp .env.example .env" "$WORKSPACE_DIR/README.md" && grep -qF "docker compose run --rm coordinator run smoke" "$WORKSPACE_DIR/README.md" && echo quickstart-claims-present',
  # --- quickstart targets exist ---
  'test -f "$WORKSPACE_DIR/.env.example" && echo env-example-exists',
  'test -f "$WORKSPACE_DIR/docker-compose.yml" && echo compose-exists',
  # smoke is a builtin (registered in scenarios.py), not a TOML file.
  'grep -q "@scenario(\"smoke\")" "$WORKSPACE_DIR/coordinator/gentar/scenarios.py" && echo smoke-defined',
  # --- dashboard claim: "docker compose run --rm dashboard renders" ---
  'grep -qF "docker compose run --rm dashboard" "$WORKSPACE_DIR/README.md" && grep -q "dashboard:" "$WORKSPACE_DIR/docker-compose.yml" && test -f "$WORKSPACE_DIR/dashboard/generate.py" && echo dashboard-claim-true',
  # --- bench template claim: "claude-code pinned by bench-template/VERSION" ---
  'grep -qF "bench-template/VERSION" "$WORKSPACE_DIR/README.md" && test -f "$WORKSPACE_DIR/bench-template/VERSION" && echo template-pin-true',
  # --- README names scenarios by name; each must exist as a suite ---
  '''cd "$WORKSPACE_DIR"
for s in claude-playbooks-install scripted-onboarding scripted-danger bench-template-verify; do
  test -f "coordinator/scenarios/$s.toml" || { echo "README names missing scenario: $s"; exit 1; }
done
echo named-scenarios-exist''',
  # --- CI claim (since 2026-10-12): every runs-on in the public workflow is
  # exactly `ubuntu-latest` (an allowlist: a renamed self-hosted label fails),
  # and the docs say the bench suites are a post-merge check in the mirror ---
  'wf="$WORKSPACE_DIR/.github/workflows/gentar.yml"; grep -qE "^[[:space:]]*runs-on:" "$wf" && ! grep -E "^[[:space:]]*runs-on:" "$wf" | grep -qvxE "[[:space:]]*runs-on: ubuntu-latest" && grep -qF "POST-MERGE check, not a PR gate" "$WORKSPACE_DIR/docs/reference/ci-and-releases.md" && echo hosted-only-claim-true',
]

[[verify.commands]]
command = 'grep -qF "exit code = verdict" "$WORKSPACE_DIR/README.md" && echo verdict-contract-stated'
contains = "verdict-contract-stated"

[[verify.commands]]
# Subject-integration doc referenced by the README's subject story exists
# and says the central dispatch is retired (since 2026-10-12).
command = 'grep -q "subject-integration" "$WORKSPACE_DIR/README.md" || true; test -f "$WORKSPACE_DIR/docs/subject-integration.md" && grep -qF "central arena is retired" "$WORKSPACE_DIR/docs/subject-integration.md" && echo integration-doc-true'
contains = "integration-doc-true"
